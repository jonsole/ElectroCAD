name: Deploy web version to GitHub Pages

# Builds the web app from the repository's default branch and deploys it to GitHub Pages
# (as DabbleCAD does from main). Using the default branch rather than a fixed name means it
# works before a main branch exists and keeps working after.
#
# One-time setup: Settings, Pages, Build and deployment, Source: "GitHub Actions".

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts skips the Electron binary download; the web build doesn't need it.
      - run: npm ci --ignore-scripts

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
